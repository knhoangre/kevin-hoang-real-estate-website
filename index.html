<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No title, description, canonical, OG, or Twitter tags here on purpose.
      src/components/Seo.tsx owns every head tag, and the static generator
      PREPENDS its output rather than replacing what is already in this file —
      so anything declared here survives as a duplicate alongside the per-route
      version. A duplicate title element in particular is a real defect.

      Prerendered pages get their tags baked in at build time; gated routes
      (auth/admin/crm) are noindex via src/components/PrivatePage.tsx.
    -->
    <meta name="author" content="Kevin Hoang" />
    <meta name="theme-color" content="#1a1a1a" />

    <!--
      Preload the homepage hero background — it is the LCP element, and as a
      CSS background-image the browser cannot discover it until the stylesheet
      has parsed. This tag lives in the shared shell so it fires on every
      prerendered route; the file is ~150KB at these parameters, which is a
      reasonable price for the homepage LCP.
    -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&amp;fit=crop&amp;w=1920&amp;q=70"
      fetchpriority="high"
    />

    <!-- Preconnect to critical origins to cut connection latency. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!--
      Fonts are linked here rather than @import-ed from index.css. An @import
      inside the stylesheet serialises the requests — HTML, then the CSS bundle,
      then this stylesheet, then the woff2 files — so text cannot paint until
      four round trips complete. Declared here, the browser discovers it while
      parsing the head, in parallel with the CSS bundle.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    />

    <!-- Favicon / PWA icons (generated by scripts/generate-icons.mjs). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
