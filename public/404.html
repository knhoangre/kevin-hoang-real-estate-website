<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Kevin Hoang</title>
    <meta name="robots" content="noindex" />

    <!--
      Analytics.

      No 404 was recorded anywhere until 2026-09-19. The site returns real HTTP
      404s by design, which is what makes the set of URLs people actually reach
      actionable — a broken inbound link, or a retired blog slug missing from
      scripts/retired-blog-slugs.json.

      This file is static and outside React, so the measurement ID is a literal
      rather than SITE.ga4Id. Keep the two in step.

      send_page_view is false and page_location is rebuilt from the origin plus a
      redacted path, for the same reason as src/components/Analytics.tsx: the
      automatic hit sends the full URL, and both a query string and an
      /apply/<token> path can carry a credential. vercel.json rewrites /apply/*
      so a token should never reach this file — the redaction is here so the rule
      holds for the whole site rather than for one component.

      page_referrer is what names the page carrying the dead link. Like
      traffic_source, it needs registering as a custom dimension to be reportable.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSRC329HZ2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-ZSRC329HZ2', { send_page_view: false });

      (function () {
        var path = location.pathname.indexOf('/apply/') === 0 ? '/apply/:token' : location.pathname;
        var where = location.origin + path;
        gtag('event', 'page_view', { page_location: where, page_title: document.title });
        gtag('event', 'page_not_found', { page_location: where, page_referrer: document.referrer });
      })();
    </script>

    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #1a1a1a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 3rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
      p { color: #4b5563; font-size: 1.125rem; margin: 0 0 2rem; }
      nav a {
        color: #1a1a1a;
        margin: 0 .75rem;
        text-decoration: none;
        border-bottom: 1px solid #d1d5db;
        padding-bottom: 2px;
      }
      nav a:hover { border-color: #1a1a1a; }
    </style>
  </head>
  <body>
    <!--
      A real static 404 served with an HTTP 404 status, NOT an SPA shell.
      The site used to rewrite every unknown URL to index.html, which returned
      HTTP 200 for typos and dead links — a soft 404, which wastes crawl budget
      and can get junk URLs indexed.
    -->
    <main>
      <h1>404</h1>
      <p>That page doesn&rsquo;t exist.</p>
      <nav>
        <a href="/">Home</a>
        <a href="/neighborhoods">Area guides</a>
        <a href="/blog">Blog</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
