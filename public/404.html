<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Kevin Hoang</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #1a1a1a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 3rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
      p { color: #4b5563; font-size: 1.125rem; margin: 0 0 2rem; }
      nav a {
        color: #1a1a1a;
        margin: 0 .75rem;
        text-decoration: none;
        border-bottom: 1px solid #d1d5db;
        padding-bottom: 2px;
      }
      nav a:hover { border-color: #1a1a1a; }
    </style>
  </head>
  <body>
    <!--
      A real static 404 served with an HTTP 404 status, NOT an SPA shell.
      The site used to rewrite every unknown URL to index.html, which returned
      HTTP 200 for typos and dead links — a soft 404, which wastes crawl budget
      and can get junk URLs indexed.
    -->
    <main>
      <h1>404</h1>
      <p>That page doesn&rsquo;t exist.</p>
      <nav>
        <a href="/">Home</a>
        <a href="/neighborhoods">Area guides</a>
        <a href="/blog">Blog</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
